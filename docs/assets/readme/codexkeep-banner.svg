<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="420"
  viewBox="0 0 1600 420"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">CodexKeep</title>
  <desc id="description">
    CodexKeep checks portable Codex configuration before synchronizing it
    between Macs through a private Git repository, while credentials, sessions,
    and machine paths stay local.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c13" />
      <stop offset="0.55" stop-color="#0d111a" />
      <stop offset="1" stop-color="#07090e" />
    </linearGradient>
    <radialGradient id="greenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1ccf88" stop-opacity="0.27" />
      <stop offset="1" stop-color="#1ccf88" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7768f4" stop-opacity="0.23" />
      <stop offset="1" stop-color="#7768f4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722" stop-opacity="0.97" />
      <stop offset="1" stop-color="#0b1018" stop-opacity="0.97" />
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b5568" />
      <stop offset="0.5" stop-color="#7e8aa0" />
      <stop offset="1" stop-color="#4b5568" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#a9b3c5"
        stroke-opacity="0.045"
        stroke-width="1"
      />
    </pattern>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="24"
        flood-color="#000000"
        flood-opacity="0.45"
      />
    </filter>
    <clipPath id="frame">
      <rect width="1600" height="420" rx="28" />
    </clipPath>
  </defs>

