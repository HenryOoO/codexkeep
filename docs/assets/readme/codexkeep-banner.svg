      cy="58"
      rx="395"
      ry="290"
      fill="url(#greenGlow)"
      filter="url(#blur)"
    />
    <ellipse
      cx="245"
      cy="435"
      rx="390"
      ry="250"
      fill="url(#violetGlow)"
      filter="url(#blur)"
